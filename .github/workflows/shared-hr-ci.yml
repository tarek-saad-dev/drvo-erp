name: Shared HR + Barber SQL API HTTP CI
on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/hr/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/hr.test.cjs'
      - 'apps/api/test/hr-admin-ui-contract.test.cjs'
      - 'apps/api/test/hr-ledger-preview.test.cjs'
      - 'tools/hr/**'
      - '.github/workflows/shared-hr-ci.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/hr/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/hr.test.cjs'
      - 'apps/api/test/hr-admin-ui-contract.test.cjs'
      - 'apps/api/test/hr-ledger-preview.test.cjs'
      - 'tools/hr/**'
      - '.github/workflows/shared-hr-ci.yml'
permissions:
  contents: read
jobs:
  hr-sql-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Nest and test HR contract
        run: |
          set -euo pipefail
          npm ci --prefix apps/api --no-audit --no-fund
          npm test --prefix apps/api
          node --check tools/hr/verify.cjs
      - name: Start disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          pass="DrvoHrCi_$(openssl rand -hex 18)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name drvo-hr-ci \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14349:1433 -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Real SQL2022 + trusted K5/Nest HTTP scope and Barber integration
        env:
          HR_SQL_DISPOSABLE: 'YES'
          HR_TEST_PORT: '14349'
        run: node tools/hr/verify.cjs
      - name: Show disposable SQL logs on failure
        if: failure()
        run: docker logs --tail 80 drvo-hr-ci || true
      - name: Remove disposable SQL
        if: always()
        run: docker rm -f drvo-hr-ci || true
