name: Shared Catalog SQL API HTTP CI
on:
  pull_request:
    paths:
      - 'apps/api/src/catalog/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/catalog.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'db/migrations/**'
      - 'tools/catalog/**'
      - '.github/workflows/shared-catalog-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/catalog/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/catalog.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'db/migrations/**'
      - 'tools/catalog/**'
      - '.github/workflows/shared-catalog-ci.yml'
permissions:
  contents: read
jobs:
  catalog-sql-http:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile API and unit tests
        run: |
          set -euo pipefail
          npm ci --prefix apps/api --no-audit --no-fund
          npm test --prefix apps/api
          node --check tools/catalog/verify.cjs
      - name: Start isolated disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          pass="DrvoCatalogCi_$(openssl rand -hex 18)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name drvo-catalog-ci \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14340:1433 \
            -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Real read/write/authorization HTTP and SQL proof
        env:
          CATALOG_SQL_DISPOSABLE: 'YES'
          CATALOG_TEST_PORT: '14340'
        run: node tools/catalog/verify.cjs
      - name: Inspect disposable SQL on failure
        if: failure()
        run: docker logs --tail 75 drvo-catalog-ci || true
      - name: Destroy isolated SQL
        if: always()
        run: docker rm -f drvo-catalog-ci || true
