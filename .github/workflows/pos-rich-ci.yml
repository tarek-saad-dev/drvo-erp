name: Cashier POS Rich SQL022 + Private UI CI
on:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/pos-drafts/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/pos-rich-draft.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/test/pos-rich-*.test.cjs'
      - 'apps/web/test/cashier-pricing-ui.test.cjs'
      - 'apps/web/test/private-pos-customer-operator.test.cjs'
      - 'apps/web/test/customer-profile-crm.test.cjs'
      - 'apps/web/test/pos-draft-quick-cart.test.cjs'
      - 'apps/web/test/pos-draft-print.test.cjs'
      - 'packages/business-modules/pos/**'
      - '_cashier_source/pos-print/**'
      - 'tools/pos-rich/**'
      - '.github/workflows/pos-rich-ci.yml'
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/pos-drafts/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/pos-rich-draft.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/test/pos-rich-*.test.cjs'
      - 'apps/web/test/cashier-pricing-ui.test.cjs'
      - 'apps/web/test/private-pos-customer-operator.test.cjs'
      - 'apps/web/test/customer-profile-crm.test.cjs'
      - 'apps/web/test/pos-draft-quick-cart.test.cjs'
      - 'apps/web/test/pos-draft-print.test.cjs'
      - 'packages/business-modules/pos/**'
      - '_cashier_source/pos-print/**'
      - 'tools/pos-rich/**'
      - '.github/workflows/pos-rich-ci.yml'
permissions:
  contents: read
jobs:
  cashier-sql-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and test real Nest modules
        run: |
          set -euo pipefail
          npm ci --prefix apps/api --no-audit --no-fund
          npm test --prefix apps/api
          node --check tools/pos-rich/verify.cjs
      - name: Start disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          pass="DrvoPosRichCi_$(openssl rand -hex 18)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name drvo-pos-rich-ci \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14344:1433 -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Actual SQL022 Cashier draft persistence and scoped HTTP verification
        env:
          POS_RICH_SQL_DISPOSABLE: 'YES'
          POS_RICH_TEST_PORT: '14344'
        run: node tools/pos-rich/verify.cjs
      - name: SQL logs on failed disposable test
        if: failure()
        run: docker logs --tail 80 drvo-pos-rich-ci || true
      - name: Remove disposable SQL
        if: always()
        run: docker rm -f drvo-pos-rich-ci || true
  cashier-private-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Private Cashier rich draft UI checks, Next build and typecheck
        run: |
          set -euo pipefail
          npm ci --prefix apps/web --no-audit --no-fund
          node --test apps/web/test/pos-rich-draft.test.cjs
          node --test apps/web/test/pos-rich-customer-draft-history.test.cjs
          node --test apps/web/test/cashier-pricing-ui.test.cjs
          node --test apps/web/test/private-pos-customer-operator.test.cjs
          node --test apps/web/test/customer-profile-crm.test.cjs
          node --test apps/web/test/pos-draft-quick-cart.test.cjs
          node --test apps/web/test/pos-draft-print.test.cjs
          env -u DRVO_K5_WEB_ENABLED -u DRVO_POS_RICH_WEB_ENABLED npm run build --prefix apps/web
          npm run typecheck --prefix apps/web
