name: Finance Option A Atomic SQL Proof CI
on:
  pull_request:
    paths:
      - 'tools/finance/option-a-atomic-sql-proof.cjs'
      - '.github/workflows/finance-option-a-atomic-proof-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/finance/option-a-atomic-sql-proof.cjs'
      - '.github/workflows/finance-option-a-atomic-proof-ci.yml'
permissions:
  contents: read
jobs:
  atomic-mechanics-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test SQL driver, validate proof script syntax
        run: |
          set -euo pipefail
          npm ci --prefix apps/api --no-audit --no-fund
          node --check tools/finance/option-a-atomic-sql-proof.cjs
      - name: Start disposable localhost SQL Server 2022 only
        shell: bash
        run: |
          set -euo pipefail
          pw="DrvoFinanceProof_$(openssl rand -hex 18)!"
          echo "::add-mask::$pw"
          echo "SQL_TEST_SA_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run --detach --name drvo-finance-atomic-ci \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:14347:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Test atomic rollback, scoped source, journal and outbox proof
        env:
          DRVO_FINANCE_PROOF_DISPOSABLE: 'YES'
          DRVO_FINANCE_TEST_PORT: '14347'
        run: node tools/finance/option-a-atomic-sql-proof.cjs
      - name: Print isolated SQL logs only on failure
        if: failure()
        run: docker logs --tail 60 drvo-finance-atomic-ci || true
      - name: Destroy disposable SQL Server
        if: always()
        run: docker rm -f drvo-finance-atomic-ci || true
