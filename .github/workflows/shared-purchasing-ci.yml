name: Shared Purchasing SQL037 + Web CI
on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/purchasing/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/purchasing.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/test/purchasing-workspace.test.cjs'
      - 'packages/business-modules/purchasing/**'
      - 'tests/purchasing-ap-preview.test.cjs'
      - '_cashier_source/purchasing/**'
      - 'tools/purchasing/**'
      - 'tools/cashier-reuse/cashier-workflow-ledger-2026-11-19.json'
      - '.github/workflows/shared-purchasing-ci.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/purchasing/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/purchasing.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/test/purchasing-workspace.test.cjs'
      - 'packages/business-modules/purchasing/**'
      - 'tests/purchasing-ap-preview.test.cjs'
      - '_cashier_source/purchasing/**'
      - 'tools/purchasing/**'
      - 'tools/cashier-reuse/cashier-workflow-ledger-2026-11-19.json'
      - '.github/workflows/shared-purchasing-ci.yml'
permissions:
  contents: read
jobs:
  purchasing-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Purchasing domain + private UI tests
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/purchasing-ap-preview.test.cjs
          npm ci --prefix apps/web --no-audit --no-fund
          node --test apps/web/test/purchasing-workspace.test.cjs
          env -u DRVO_K5_WEB_ENABLED -u DRVO_PURCHASING_WEB_ENABLED -u DRVO_INVENTORY_WEB_ENABLED \
            npm run build --prefix apps/web
          npm run typecheck --prefix apps/web
  purchasing-sql-http:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Nest and purchasing unit tests
        run: |
          set -euo pipefail
          npm ci --prefix apps/api --no-audit --no-fund
          npm test --prefix apps/api
          node --check tools/purchasing/verify.cjs
      - name: Start disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          pass="PurchasingCi_$(openssl rand -hex 18)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name drvo-purchasing-ci \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14347:1433 -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Verify SQL037 suppliers/receive/AP preview through Nest HTTP
        env:
          PURCHASING_SQL_DISPOSABLE: 'YES'
          PURCHASING_TEST_PORT: '14347'
        run: node tools/purchasing/verify.cjs
      - name: SQL logs on failure
        if: failure()
        run: docker logs --tail 100 drvo-purchasing-ci || true
      - name: Remove disposable SQL
        if: always()
        run: docker rm -f drvo-purchasing-ci || true
