name: DRVO ERP — Staging Database Automation CI
on:
  pull_request:
    paths:
      - 'ops/staging/db-automation/**'
      - 'tools/staging-db-automation/**'
      - 'db/migrations/**'
      - '.github/workflows/staging-db-migrate.yml'
      - '.github/workflows/staging-db-automation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ops/staging/db-automation/**'
      - 'tools/staging-db-automation/**'
      - 'db/migrations/**'
      - '.github/workflows/staging-db-migrate.yml'
      - '.github/workflows/staging-db-automation-ci.yml'
permissions:
  contents: read
jobs:
  guarded-sql-migrator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fixed host scripts and safe payload
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/staging/db-automation/receive-sql.cjs
          node --check ops/staging/db-automation/sql-bootstrap.cjs
          node --check ops/staging/db-automation/build-payload.cjs
          node --check tools/staging-db-automation/verify.cjs
          bash -n ops/staging/db-automation/prepare-once.sh
          bash -n ops/staging/db-automation/receive-sql.sh
          # Reproduce the VPS root shell's minimal PATH. useradd is often
          # installed in /usr/sbin and must resolve BEFORE any provisioning.
          installer_path="$(sed -n 's/^export PATH=//p' ops/staging/db-automation/prepare-once.sh)"
          test -n "$installer_path"
          env -i PATH="$installer_path" /bin/bash -c 'command -v useradd && command -v install && command -v ssh-keygen'
          npm ci --prefix apps/api --no-audit --no-fund
          GITHUB_SHA="$(git rev-parse HEAD)" node ops/staging/db-automation/build-payload.cjs > "$RUNNER_TEMP/preview-migrations.json"
          test -s "$RUNNER_TEMP/preview-migrations.json"
      - name: Start localhost-only SQL Server with isolated restore storage
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0777 /var/opt/mssql/data
          test -z "$(find /var/opt/mssql/data -mindepth 1 -maxdepth 1 -print -quit)"
          pw="DrvoDBAuto_$(openssl rand -hex 18)!"
          echo "::add-mask::$pw"
          echo "SQL_TEST_SA_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run --detach --name drvo-db-auto-ci \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:14337:1433 \
            -v /var/opt/mssql/data:/var/opt/mssql/data \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Test SQL-only migrator with restricted SQL principal and restore
        env:
          DRVO_DB_CI_DISPOSABLE: 'YES'
          DRVO_DB_CI_PORT: '14337'
          NODE_PATH: ${{ github.workspace }}/apps/api/node_modules
        run: node tools/staging-db-automation/verify.cjs
      - name: Inspect disposable SQL logs on error
        if: failure()
        run: docker logs --tail 75 drvo-db-auto-ci || true
      - name: Remove throwaway container
        if: always()
        run: docker rm -f drvo-db-auto-ci || true

  root-bootstrap-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check operator bootstrap and restore proof syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/staging/db-automation/prepare-once.sh
          node --check ops/staging/db-automation/sql-bootstrap.cjs
          node --check tools/staging-db-automation/verify-bootstrap-ci.cjs
          npm ci --prefix apps/api --no-audit --no-fund
      - name: Verify historical bootstrap using checkout owner, not root Git
        shell: bash
        run: |
          set -euo pipefail
          baseline=72e5ce5b5326d8d9d060eba49c8fedc1543e942a
          repo_owner="$(stat -c '%U' "$GITHUB_WORKSPACE")"
          [[ "$repo_owner" != root ]] || { echo "CI checkout unexpectedly root-owned"; exit 1; }
          sudo -u "$repo_owner" -H git -C "$GITHUB_WORKSPACE" cat-file -e \
            "$baseline:ops/staging/db-automation/sql-bootstrap.cjs"
          checked="$(sudo -u "$repo_owner" -H git -C "$GITHUB_WORKSPACE" show \
            "$baseline:ops/staging/db-automation/sql-bootstrap.cjs" | sha256sum | cut -d' ' -f1)"
          test "$checked" = "$(sudo -u "$repo_owner" -H git -C "$GITHUB_WORKSPACE" show \
            "$baseline:ops/staging/db-automation/sql-bootstrap.cjs" | sha256sum | cut -d' ' -f1)"
          grep -Fq 'sudo -u drvoerp -H git -C "$repo" cat-file -e' \
            ops/staging/db-automation/prepare-once.sh
          echo 'PASS: protected historical source works through the Git checkout owner'
      - name: Mount isolated SQL restore directory on the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0777 /var/opt/mssql/data
          sudo install -d -m 0755 /srv/drvo-erp
          sudo ln -s "$GITHUB_WORKSPACE" /srv/drvo-erp/repo
          pw="DrvoDbBootstrap_$(openssl rand -hex 16)!"
          echo "::add-mask::$pw"
          echo "SQL_TEST_SA_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run --detach --name drvo-db-auto-bootstrap-ci \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:1433:1433 \
            -v /var/opt/mssql/data:/var/opt/mssql/data \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Execute exact root SQL bootstrap using throwaway SQL only
        env:
          DRVO_DB_CI_DISPOSABLE: 'YES'
          NODE_PATH: ${{ github.workspace }}/apps/api/node_modules
        run: sudo -E node tools/staging-db-automation/verify-bootstrap-ci.cjs
      - name: Verify dedicated secret is readable only by restricted Unix user
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/staging/db-automation/check-runtime.cjs
          sudo useradd --system --user-group --create-home \
            --home-dir /var/lib/drvoerp-dbdeploy --shell /bin/bash drvoerp-dbdeploy
          sudo chown root:drvoerp-dbdeploy /etc/drvo-erp-db-automation
          sudo chmod 0710 /etc/drvo-erp-db-automation
          sudo chown root:drvoerp-dbdeploy \
            /etc/drvo-erp-db-automation/staging-db-automation.env
          sudo chmod 0640 /etc/drvo-erp-db-automation/staging-db-automation.env
          sudo -u drvoerp-dbdeploy -H /usr/bin/env \
            NODE_PATH="$GITHUB_WORKSPACE/apps/api/node_modules" \
            "$(command -v node)" \
            "$GITHUB_WORKSPACE/ops/staging/db-automation/check-runtime.cjs"
          # Nobody else may read the SQL migration secret, despite the
          # dedicated group member being able to traverse its parent.
          if sudo -u nobody test -r /etc/drvo-erp-db-automation/staging-db-automation.env; then
            echo "ERROR: migration SQL secret is visible to an unrelated user"
            exit 1
          fi
      - name: Diagnose disposable SQL on failure
        if: failure()
        run: docker logs --tail 80 drvo-db-auto-bootstrap-ci || true
      - name: Tear down isolated SQL container
        if: always()
        run: docker rm -f drvo-db-auto-bootstrap-ci || true
