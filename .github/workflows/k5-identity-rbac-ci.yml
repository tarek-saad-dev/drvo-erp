name: K5 Identity & RBAC SQL HTTP CI
on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/identity/**'
      - 'apps/api/src/data/foundation-database.service.ts'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/identity.test.cjs'
      - 'tools/k5-auth/**'
      - 'ops/staging/k5a-*.sh'
      - 'ops/staging/k5a-*.cjs'
      - 'tools/k4-db/migrate.cjs'
      - '.github/workflows/k5-identity-rbac-ci.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/identity/**'
      - 'tools/k5-auth/**'
      - 'tools/k4-db/migrate.cjs'
      - '.github/workflows/k5-identity-rbac-ci.yml'
permissions:
  contents: read
jobs:
  identity-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate test harness syntax
        run: |
          node --check tools/k5-auth/verify.cjs
          node --check tools/k5-auth/verify-operator-ci.cjs
          node --check ops/staging/k5a-sql-apply.cjs
          bash -n ops/staging/k5a-apply-once.sh
      - name: Install locked NestJS API dependencies and build
        run: |
          npm ci --prefix apps/api --no-audit --no-fund
          npm run test --prefix apps/api
      - name: Start throwaway localhost SQL Server (never VPS)
        shell: bash
        run: |
          set -euo pipefail
          pass="DrvoK5_$(openssl rand -hex 16)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name drvo-k5-isolated-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14335:1433 \
            -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Run SQL Server, login, session and branch RBAC E2E
        env:
          K5_SQL_DISPOSABLE: 'YES'
          K5_TEST_PORT: '14335'
        run: node tools/k5-auth/verify.cjs
      - name: Inspect disposable SQL container on failure
        if: failure()
        run: docker logs --tail 100 drvo-k5-isolated-sql || true
      - name: Remove disposable SQL instance
        if: always()
        run: docker rm -f drvo-k5-isolated-sql || true

  operator-migration-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate operator script syntax
        run: |
          node --check ops/staging/k5a-sql-apply.cjs
          node --check tools/k5-auth/verify-operator-ci.cjs
          bash -n ops/staging/k5a-apply-once.sh
      - name: Install locked SQL driver
        run: npm ci --prefix apps/api --no-audit --no-fund
      - name: Mount disposable backup files on an isolated runner
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0777 /var/opt/mssql/data
          test -z "$(find /var/opt/mssql/data -mindepth 1 -maxdepth 1 -print -quit)"
          pass="DrvoK5_$(openssl rand -hex 16)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name drvo-k5-operator-disposable \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14335:1433 \
            -p 127.0.0.1:1433:1433 \
            -v /var/opt/mssql/data:/var/opt/mssql/data \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Run exact root SQL migration backup and restore in disposable CI
        env:
          K5_SQL_DISPOSABLE: 'YES'
          K5_TEST_PORT: '14335'
        run: |
          sudo -n env GITHUB_ACTIONS=true K5_SQL_DISPOSABLE=YES \
            K5_TEST_PORT=14335 SQL_TEST_SA_PASSWORD="$SQL_TEST_SA_PASSWORD" \
            "$(command -v node)" tools/k5-auth/verify-operator-ci.cjs
      - name: Inspect disposable SQL on failure
        if: failure()
        run: docker logs --tail 100 drvo-k5-operator-disposable || true
      - name: Remove isolated container
        if: always()
        run: docker rm -f drvo-k5-operator-disposable || true
