name: HR Attendance SQL2022 + Web CI
on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/hr/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/attendance.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/test/hr-attendance.test.cjs'
      - 'tools/hr/attendance-verify.cjs'
      - '.github/workflows/hr-attendance-ci.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/hr/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/attendance.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/test/hr-attendance.test.cjs'
      - 'tools/hr/attendance-verify.cjs'
      - '.github/workflows/hr-attendance-ci.yml'
permissions:
  contents: read
jobs:
  attendance-api-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Nest, unit-test and verify fixture syntax
        run: |
          set -euo pipefail
          npm ci --prefix apps/api --no-audit --no-fund
          npm test --prefix apps/api
          node --check tools/hr/attendance-verify.cjs
      - name: Create disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          pass="AttendanceCi_$(openssl rand -hex 18)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name drvo-hr-attendance-ci \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14346:1433 -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: SQL020 persisted punches + Nest HTTP authorization checks
        env:
          ATTENDANCE_SQL_DISPOSABLE: 'YES'
          ATTENDANCE_TEST_PORT: '14346'
        run: node tools/hr/attendance-verify.cjs
      - name: Print disposable SQL failure evidence
        if: failure()
        run: docker logs --tail 100 drvo-hr-attendance-ci || true
      - name: Destroy disposable SQL Server
        if: always()
        run: docker rm -f drvo-hr-attendance-ci || true
  attendance-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Light private HR attendance route/source tests, Next build/typecheck
        run: |
          set -euo pipefail
          npm ci --prefix apps/web --no-audit --no-fund
          node --test apps/web/test/hr-attendance.test.cjs
          env -u DRVO_K5_WEB_ENABLED -u DRVO_HR_ATTENDANCE_WEB_ENABLED npm run build --prefix apps/web
          npm run typecheck --prefix apps/web
