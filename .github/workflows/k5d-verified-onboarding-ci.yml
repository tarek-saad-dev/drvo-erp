name: K5D Verified Onboarding SQL Foundation CI
on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'tools/k5d/**'
      - 'apps/api/src/identity/verification-crypto.ts'
      - 'apps/api/test/verification-crypto.test.cjs'
      - 'apps/api/src/identity/verification-mailer.ts'
      - 'apps/api/src/identity/owner-bootstrap.ts'
      - 'apps/api/test/verification-mailer.test.cjs'
      - '.github/workflows/k5d-verified-onboarding-ci.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'tools/k5d/**'
      - 'apps/api/src/identity/verification-crypto.ts'
      - 'apps/api/test/verification-crypto.test.cjs'
      - 'apps/api/src/identity/verification-mailer.ts'
      - 'apps/api/test/verification-mailer.test.cjs'
      - '.github/workflows/k5d-verified-onboarding-ci.yml'
permissions:
  contents: read
jobs:
  sql-invitation-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated test harness and API dependencies
        run: |
          set -euo pipefail
          node --check tools/k5d/verify.cjs
          node --check tools/k5d/verify-owner-bootstrap.cjs
          npm ci --prefix apps/api --no-audit --no-fund
          npm test --prefix apps/api
      - name: Start disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          pw="K5D_OnboardCi_$(openssl rand -hex 18)!"
          echo "::add-mask::$pw"
          echo "SQL_TEST_SA_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run --detach --name drvo-k5d-ci \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:14338:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Verify verified-email and invitation schema deny-by-default
        env:
          K5D_SQL_DISPOSABLE: 'YES'
          K5D_TEST_PORT: '14338'
        run: |
          node tools/k5d/verify.cjs
          node tools/k5d/verify-owner-bootstrap.cjs
      - name: Show SQL log on failure only
        if: failure()
        run: docker logs --tail 80 drvo-k5d-ci || true
      - name: Destroy disposable SQL
        if: always()
        run: docker rm -f drvo-k5d-ci || true
