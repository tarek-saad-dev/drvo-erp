name: K5D Verified Onboarding SQL Foundation CI
on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'tools/k5d/**'
      - '.github/workflows/k5d-onboarding-foundation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'tools/k5d/**'
      - '.github/workflows/k5d-onboarding-foundation-ci.yml'
permissions:
  contents: read
jobs:
  onboarding-sql-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check test harness and install locked SQL dependencies
        run: |
          node --check tools/k5d/verify.cjs
          npm ci --prefix apps/api --no-audit --no-fund
      - name: Start isolated SQL Server 2022, localhost only
        shell: bash
        run: |
          set -euo pipefail
          pass="K5D_SQL_CI_$(openssl rand -hex 16)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name k5d-onboarding-sql \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14338:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Verify approval, challenge and invitation integrity
        env:
          K5D_SQL_DISPOSABLE: 'YES'
          K5D_TEST_PORT: '14338'
        run: node tools/k5d/verify.cjs
      - name: Inspect isolated SQL logs on failure
        if: failure()
        run: docker logs --tail 70 k5d-onboarding-sql || true
      - name: Remove isolated SQL instance
        if: always()
        run: docker rm -f k5d-onboarding-sql || true
