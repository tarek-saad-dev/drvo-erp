name: Operations + Treasury Ops SQL2022 + Web CI
on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/operations/**'
      - 'apps/api/src/treasury/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/operations.test.cjs'
      - 'apps/api/test/treasury-ops.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/test/operations-treasury-ops.test.cjs'
      - 'tests/ops-treasury-source.test.cjs'
      - '_cashier_source/**'
      - 'tools/cashier-reuse/cashier-workflow-ledger-2026-11-19.json'
      - 'tools/ops-treasury/verify.cjs'
      - '.github/workflows/ops-treasury-ci.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/operations/**'
      - 'apps/api/src/treasury/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/operations.test.cjs'
      - 'apps/api/test/treasury-ops.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/test/operations-treasury-ops.test.cjs'
      - 'tests/ops-treasury-source.test.cjs'
      - '_cashier_source/**'
      - 'tools/cashier-reuse/cashier-workflow-ledger-2026-11-19.json'
      - 'tools/ops-treasury/verify.cjs'
      - '.github/workflows/ops-treasury-ci.yml'
permissions:
  contents: read
jobs:
  ops-treasury-api-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Nest, unit-test and verify fixture syntax
        run: |
          set -euo pipefail
          npm ci --prefix apps/api --no-audit --no-fund
          npm test --prefix apps/api
          node --check tools/ops-treasury/verify.cjs
      - name: Create disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          pass="OpsTrCi_$(openssl rand -hex 18)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name drvo-ops-treasury-ci \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14348:1433 -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: SQL029/030 day-shift-movements + Nest HTTP authorization checks
        env:
          OPS_TREASURY_SQL_DISPOSABLE: 'YES'
          OPS_TREASURY_TEST_PORT: '14348'
        run: node tools/ops-treasury/verify.cjs
      - name: Print disposable SQL failure evidence
        if: failure()
        run: docker logs --tail 100 drvo-ops-treasury-ci || true
      - name: Destroy disposable SQL Server
        if: always()
        run: docker rm -f drvo-ops-treasury-ci || true
  ops-treasury-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Light Operations/Treasury ops route and source characterization tests
        run: |
          set -euo pipefail
          npm ci --prefix apps/web --no-audit --no-fund
          npm ci --no-audit --no-fund
          node --test apps/web/test/operations-treasury-ops.test.cjs
          node --test tests/ops-treasury-source.test.cjs
          env -u DRVO_K5_WEB_ENABLED -u DRVO_OPERATIONS_WEB_ENABLED \
            -u DRVO_TREASURY_OPS_WEB_ENABLED -u DRVO_TREASURY_COUNTS_WEB_ENABLED \
            npm run build --prefix apps/web
          npm run typecheck --prefix apps/web
