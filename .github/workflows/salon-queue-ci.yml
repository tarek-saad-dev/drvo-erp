name: Salon Queue SQL2022 + Web CI
on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/queue/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/queue.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/test/booking-queue.test.cjs'
      - 'tests/booking-queue-source.test.cjs'
      - 'tests/fixtures/cashier/queueLifecycleEngine.ts'
      - '_cashier_source/**'
      - 'packages/business-modules/queue/**'
      - 'tools/cashier-reuse/cashier-workflow-ledger-2026-11-19.json'
      - 'tools/queue/verify.cjs'
      - '.github/workflows/salon-queue-ci.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/queue/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/queue.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/test/booking-queue.test.cjs'
      - 'tests/booking-queue-source.test.cjs'
      - 'tests/fixtures/cashier/queueLifecycleEngine.ts'
      - '_cashier_source/**'
      - 'packages/business-modules/queue/**'
      - 'tools/cashier-reuse/cashier-workflow-ledger-2026-11-19.json'
      - 'tools/queue/verify.cjs'
      - '.github/workflows/salon-queue-ci.yml'
permissions:
  contents: read
jobs:
  queue-api-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Nest, unit-test and verify fixture syntax
        run: |
          set -euo pipefail
          npm ci --prefix apps/api --no-audit --no-fund
          npm test --prefix apps/api
          node --check tools/queue/verify.cjs
      - name: Create disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          pass="QueueCi_$(openssl rand -hex 18)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name drvo-salon-queue-ci \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14347:1433 -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: SQL026/036 queue tickets + Nest HTTP authorization checks
        env:
          QUEUE_SQL_DISPOSABLE: 'YES'
          QUEUE_TEST_PORT: '14347'
        run: node tools/queue/verify.cjs
      - name: Print disposable SQL failure evidence
        if: failure()
        run: docker logs --tail 100 drvo-salon-queue-ci || true
      - name: Destroy disposable SQL Server
        if: always()
        run: docker rm -f drvo-salon-queue-ci || true
  queue-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Light Booking/Queue route and source characterization tests
        run: |
          set -euo pipefail
          npm ci --prefix apps/web --no-audit --no-fund
          npm ci --no-audit --no-fund
          node --test apps/web/test/booking-queue.test.cjs
          node --test tests/booking-queue-source.test.cjs
          env -u DRVO_K5_WEB_ENABLED -u DRVO_QUEUE_WEB_ENABLED -u DRVO_BOOKING_WEB_ENABLED \
            npm run build --prefix apps/web
          npm run typecheck --prefix apps/web
