name: Shared Expenses Core SQL + Browser Build CI
on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/expenses/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/expenses.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/src/app/drvo-light.css'
      - 'apps/web/test/expenses-workspace.test.cjs'
      - 'tools/expenses/**'
      - '.github/workflows/shared-expenses-ci.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'apps/api/src/expenses/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/test/expenses.test.cjs'
      - 'apps/web/src/app/workspace/**'
      - 'apps/web/src/app/drvo-light.css'
      - 'apps/web/test/expenses-workspace.test.cjs'
      - 'tools/expenses/**'
      - '.github/workflows/shared-expenses-ci.yml'
permissions:
  contents: read
jobs:
  expenses-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate private Expenses UI and build Next.js
        run: |
          set -euo pipefail
          npm ci --prefix apps/web --no-audit --no-fund
          node --test apps/web/test/expenses-workspace.test.cjs
          env -u DRVO_K5_WEB_ENABLED -u DRVO_EXPENSES_WEB_ENABLED npm run build --prefix apps/web
          npm run typecheck --prefix apps/web
  expenses-sql-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Nest, run unit tests and syntax-check SQL verifier
        run: |
          set -euo pipefail
          npm ci --prefix apps/api --no-audit --no-fund
          npm test --prefix apps/api
          node --check tools/expenses/verify.cjs
      - name: Start disposable SQL Server 2022 (no real credentials)
        shell: bash
        run: |
          set -euo pipefail
          pass="DrvoExpensesCi_$(openssl rand -hex 18)!"
          echo "::add-mask::$pass"
          echo "SQL_TEST_SA_PASSWORD=$pass" >> "$GITHUB_ENV"
          docker run --detach --name drvo-expenses-ci \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$pass" \
            -p 127.0.0.1:14347:1433 -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Verify real SQL019 categories and expense drafts through scoped Nest HTTP
        env:
          EXPENSES_SQL_DISPOSABLE: 'YES'
          EXPENSES_TEST_PORT: '14347'
        run: node tools/expenses/verify.cjs
      - name: SQL logs on failure
        if: failure()
        run: docker logs --tail 80 drvo-expenses-ci || true
      - name: Remove disposable SQL
        if: always()
        run: docker rm -f drvo-expenses-ci || true
